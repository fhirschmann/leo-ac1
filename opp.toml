# opp project file (openscad-print-project): the static settings of LEO-AC1. Each key is a print_project.py setting in
# lower case (reference/project-file.md); print_project.py adds checks(ctx). Package defaults are left out: printer
# H2S (only the bed differs), process keys equal to the package's (gyroid, one first-layer wall), folders, TPU solid.

[project]
status = "finished"   # active | finished: printed and in use, opp upgrade leaves it on its version
finished = 2026-10-07
source = "leo_ac.scad"
allowed_overlaps = [
    ["fan", "screws_fan"],            # the fan is a solid envelope, its screws run through the frame holes
    ["bail", "bail_half"], ["bail", "bail_up"], ["bail_half", "bail_up"],   # one bail in three swing positions
]
# the grey grille bars run through the whole 3.2 mm front plate (user: grille printed into the housing)
inlay_max_depth = 3.3
# housing and back cover in the middle of the bed (user), prime tower behind them
centre_plates = ["Housing", "Back cover"]
project_3mf = "stl/leo_ac1_all_parts.3mf"
test_3mf = "stl/leo_ac1_fit_tests.3mf"
test_filament = 1                     # fit tests single-colour in PETG white (user)
limitations = [
    "Bought parts as envelopes (fan block, battery cylinder), no vendor CAD",
    "Screws without threads, heads simplified",
    "Sampled motion, no continuous swept-volume proof",
    "No flexible deformation, physical fit, strength, airflow or thermal validation",
]
# opp all: analyses after every export (entries: command or [command, *options])
analyze = ["islands", "overhangs", "thickness", "fins", "inlays"]

# Print parts: name = [quantity in the full build, material, body count]. Quantity 0 = optional test print.
# Must match the part branches in the source exactly (checked). The material key also picks the filament slot,
# so one material in two colours gets one key per colour.
[parts]
body = [1, "PETG-white", 1]
back = [1, "PETG-white", 1]
cover = [1, "PETG-grey", 1]
bail = [1, "PETG-grey", 1]
knob = [1, "PETG-grey", 1]
foot = [2, "TPU", 1]
chg_holder = [1, "PETG-grey", 1]      # charge module holder, taped onto the pads of the already printed housing
tie_clip = [6, "PETG-grey", 1]        # loose glue-in cable tie clips for the wiring (user)
# fit test: right section of housing and back cover, cut from the real parts
test_right = [0, "PETG-white", 1]
test_right_back = [0, "PETG-white", 1]

# Assembly bodies in installed position: name = OpenSCAD call. Every pair is checked for overlap.
[assembly]
body = "body();"
back = "back();"
cover = "cover();"
bail = "bail();"
# the swing, sampled half way and at the carrying angle: checked against the housing
bail_half = "bail(bail_carry / 2);"
bail_up = "bail(bail_carry);"
feet = "place_feet();"
knob = "knob();"
pot = "pot_env(nut = false);"
pot_nut = "pot_nut_env();"
pwm_board = "pwm_board_env();"
led = "led_env();"
chg_module = "chg_module_env();"
chg_holder = "chg_holder();"
chg_sink = "chg_rear_sink_env();"
chg_tie = "chg_tie_env();"
usb_trigger = "usbc_env();"
switch = "sw_env();"
fan = "fan_env();"
battery = "battery_env();"
screws_fan = "screws_fan();"
screws_back = "screws_back();"
screws_bail = "screws_bail();"
screws_feet = "screws_feet();"

# Multicolour: part = inlay names; the source needs the branches <part>_base and <part>_<inlay>
[color_parts]
body = ["label", "dedication", "grille"]   # logo on the front face, dedication raised inside, grille printed in
back = ["qr"]                         # QR code on the back (user)
knob = ["pointer"]                    # white knob pointer

[printer]
bed = "Textured PEI Plate"

# Drop resistant; 5 walls (user: 3 too few), lighter than 6 walls and 30 %
[process]
wall_loops = 5
top_shell_layers = 4
bottom_shell_layers = 4
infill = 15

# First-layer lines on the front face parallel to its long edge (user; default 45 degrees). The package default of one
# wall on the first layer stays: the logo and grille inlays on the bed face do not look bold (user; 5 walls filled the
# letters).
[process.settings]
infill_direction = 0

# Filament slots of the project 3MF, 1-based in this order; inlay slots name their inlay or a list of inlays
[[filaments]]
material = "PETG-white"
profile = "Bambu PETG HF @BBL H2S"
colour = "#FFFFFF"

[[filaments]]
material = "PETG-grey"
profile = "Bambu PETG HF @BBL H2S"
colour = "#8E9294"

[[filaments]]
material = "PETG-grey"
profile = "Bambu PETG HF @BBL H2S"
inlay = ["label", "dedication", "grille", "qr"]
colour = "#8E9294"

[[filaments]]
material = "TPU"
profile = "Generic TPU @BBL H2S"
colour = "#222326"

[[filaments]]
material = "PETG-white"
profile = "Bambu PETG HF @BBL H2S"
inlay = ["pointer"]
colour = "#FFFFFF"

[plates]
Housing = ["body"]
"Back cover" = ["back"]
"Grey parts" = ["cover", "bail", "knob", "chg_holder", "tie_clip"]
"TPU feet" = ["foot"]

# fit test before the full build: right section of housing and back cover with a knob, as little material as possible
[test_plates]
"Right section fit test" = ["test_right", "test_right_back", "knob"]

[test_process]
wall_loops = 2
top_shell_layers = 3
bottom_shell_layers = 3
infill = 10

# AGENTS.md: the 0.8 mm skin in front of the LED is intended (also in the right-side fit test)
[analyze_accepted]
thickness = { body = 1, test_right = 1 }

[viewer]
title = "LEO-AC1"
page_title = "LEO-AC1 fan"
eyebrow = "Assembly · installed position"
dims = [["Width", "252"], ["Depth", "82.5"], ["Height, bail folded", "176.5"]]
groups = [
    ["white", "Printed · PETG white"], ["grey", "Printed · PETG grey"],
    ["tpu", "Printed · TPU"], ["screws", "Screws"], ["bought", "Bought parts"], ["carry", "Bail · carrying position"],
]
hidden_groups = ["bought", "carry"]
swaps = [["Raise the bail", ["bail_up"], ["bail"]]]
outer = ["body", "back", "cover", "bail", "bail_up", "knob", "feet", "screws_back", "screws_bail", "screws_feet"]
cut = ["back", "cover", "screws_back"]
# id, label, group, colour, quantity, explode direction (mm per slider mm)
parts = [
    ["body", "Housing", "white", "#f2f2ee", "1x", [0, 0, 0]],
    ["back", "Back cover", "white", "#e6e6e1", "1x", [0, 1.5, 0]],
    ["cover", "Service cover", "grey", "#8f9396", "1x", [1, 0, 0]],
    ["bail", "Folding bail", "grey", "#8f9396", "1x", [0, 0, 1.2]],
    ["bail_up", "Folding bail · carrying position", "carry", "#8f9396", "1x", [0, 0, 1.2]],
    ["knob", "Speed knob", "grey", "#8f9396", "1x", [2, 0, 0]],
    ["feet", "Feet · TPU", "tpu", "#222326", "2x", [0, 0, -0.8]],
    ["fan_visual", "Fan 140 mm · placeholder (e.g. Noctua NF-A14x25 G2 PWM)", "bought", "#303236", "1x", [0, 0.8, 0]],
    ["battery", "Battery LiFePO4 3.2 V 6000 mAh", "bought", "#3f7fbf", "1x", [0, 0.5, 0]],
    ["pot", "Potentiometer · housing in the wall pocket, washer and nut outside", "bought", "#3a3d41", "1x",
     [-0.5, 0, 0]],
    ["chg_holder", "Charge module holder · taped onto the housing pads", "grey", "#8f9396", "1x", [0, 0.8, 0]],
    ["chg_module", "Charge/boost module · IN end up, planned small heatsink on the IC", "bought", "#c9c9c9", "1x",
     [0, 0.8, 0]],
    ["chg_sink", "Heatsink 14 × 14 × 6 behind the charger IC", "bought", "#b8bcc2", "1x", [0, 0.8, 0]],
    ["chg_tie", "Cable tie 2.5 mm round the OUT end of the charge module", "bought", "#1b1b1b", "1x", [0, 0.8, 0]],
    ["led", "USB power indicator LED 3 mm, behind the O", "bought", "#9fd3ff", "1x", [0, 1, 0]],
    ["usb_trigger", "USB-C PD trigger, 5 V (Type A)", "bought", "#4b2a7a", "1x", [0, 1.5, 0]],
    ["switch", "Power switch KCD11 · rocker about 2 mm proud of the back face", "bought", "#1b1b1b", "1x",
     [0, 1.8, 0]],
    ["pwm_board", "PWM board CNY-FA5-PRO · on pads under its pin-free edges", "bought", "#2e6b3f", "1x", [-0.5, 0, 0]],
    # screws leave their part: same direction, further out
    ["screws_fan", "Fan · M3 × 30 button head", "screws", "#26282b", "4x", [0, 1.4, 0]],
    ["screws_back", "Back cover · M3 × 8 button head", "screws", "#26282b", "6x", [0, 2.2, 0]],
    ["screws_bail", "Bail pivots · M4 shoulder screw, flanged brass bushing", "screws", "#26282b", "2x", [0, 0, 1.2]],
    ["screws_feet", "Feet · M3 × 8 button head, from below", "screws", "#26282b", "4x", [0, 0, -1.4]],
]
copy_to = "docs/index.html"           # opp viewer / opp all also write the viewer page for GitHub Pages

[viewer.colour]
body = [
    ["label", "Housing · logo", "#8f9396"],
    ["dedication", "Housing · dedication", "#8f9396"],
    ["grille", "Housing · fan grille, printed in", "#8f9396"],
]
back = [["qr", "Back cover · QR code to the project", "#8f9396"]]
knob = [["pointer", "Speed knob · pointer", "#ffffff"]]

[viewer.bodies]
body_base = 'body_install_pose() body_piece("base");'
body_label = 'body_install_pose() body_piece("label");'
body_dedication = 'body_install_pose() body_piece("dedication");'
body_grille = 'body_install_pose() body_piece("grille");'
back_base = 'back_install_pose() back_piece("base");'
back_qr = 'back_install_pose() back_piece("qr");'
knob_base = 'knob_install_pose() knob_piece("base");'
knob_pointer = 'knob_install_pose() knob_piece("pointer");'
# simple fan drawn in the model, no vendor CAD in the viewer (user: placeholder, also for the private viewer)
fan_visual = "fan_visual();"
pot = "pot_env();"
screws_fan = "screws_fan(true);"
screws_back = "screws_back(true);"
screws_bail = "screws_bail(true);"
screws_feet = "screws_feet(true);"

[views]
01_assembly = ["assembly();", "-160,-330,230,112,40,70"]
02_back = ["assembly();", "420,380,230,112,40,70"]
03_exploded = ["assembly(40);", "-200,-380,260,112,40,70"]
# front turned up (OpenSCAD renders faces towards -y dark), oblique so the grooves show
04_front_right = [
    """rotate([-90, 0, 0]) intersection() { assembly(); \
    translate([part_x - 14, -10, 0]) cube([body_w - part_x + 20, 20, body_h + 1]); }""",
    "199,-260,440,199,86,0",
]
# air duct from behind: body cut at 30 mm depth, fan hidden
# public images: every body coloured (uncoloured cut faces take the scheme's back-face colour), dedication hidden
05_duct = [
    """color("#f2f2ee") intersection() { body(dedication = false); \
    translate([-1, -1, -1]) cube([body_w + 2, 30, body_h + 2]); }""",
    "112,420,300,112,0,77",
]
# service cover with the speed knob, from the right
06_knob = ["intersection() { assembly(); translate([165, 0, 20]) cube([100, 80, 140]); }", "420,-120,200,230,40,90"]
# charge/boost module in its clip holder on the partition, from behind and the fan side with the back cover removed
08_charge_module = [
    """intersection() { union() { color("#f2f2ee") body(dedication = false); color("#8f9396") chg_holder(); \
    color("#2e6b3f") chg_module_env(); color("#d9dcdf") chg_rear_sink_env(); color("#1b1b1b") chg_tie_env(); } \
    translate([part_x - 30, 30, 55]) cube([36, 34, 65]); }""",
    "95,5,130,155,48,86",
    { light = "left" },
]
# LED pocket behind the O, cut through the LED axis and seen from behind: 0.8 mm white skin in front of the LED
09_led = [
    """intersection() { union() { color("#f2f2ee") body(dedication = false); color("#9fd3ff") led_env(); } \
    translate([led_xz[0] - 9, -1, led_xz[1] - 8]) cube([18, 10, 8]); }""",
    "232,40,178,207,3,131",
]
# L bail at the carrying angle: upper legs on the step ramps, bar above the pivots
11_bail = ["assembly(bail_angle = bail_carry);", "-150,-300,330,112,40,90"]
# back cover insert boss in the top left corner from behind and below, back cover off: column and cone into the corner
12_back_bosses = [
    """color("#f2f2ee") intersection() { body(dedication = false); \
    translate([-1, 30, body_h - 50]) cube([45, body_d, 52]); }""",
    "110,190,77,12,62,159",
]
# left TPU foot cut at its screw axes, seen from the right: pocket, insert boss, screw, recessed head
13_foot_mount = [
    """intersection() { union() { color("#f2f2ee") body(dedication = false); color("#222326") place_feet(); \
    color("#26282b") screws_feet(true); } translate([-1, 0, -10]) cube([foot_inset + 1, body_d, 30]); }""",
    "130,40,-35,17,40,2",
]
# USB-C charging socket in the back cover, cut at its axis and seen from above: plate, channel, module, stop on the wall
14_usb_c = [
    """intersection() { union() { color("#f2f2ee") body(dedication = false); color("#e6e6e1") back(); \
    color("#4b2a7a") usbc_env(); } \
    translate([usbc_xz[0] - 14, body_d - 26, usbc_xz[1] - 20]) cube([body_w + 1 - (usbc_xz[0] - 14), 27, 20]); }""",
    "205,30,180,212,56,68",
]
# power switch in its well below the USB-C socket, cut at the switch axis and seen from the left
15_switch = [
    """intersection() { union() { color("#e6e6e1") back(); color("#1b1b1b") sw_env(); } \
    translate([sw_xz[0], 40, sw_xz[1] - 20]) cube([30, 45, 40]); }""",
    "87,40,89,198,70,44",
]
# battery saddles on the inside of the back cover: root fillets and the rib behind the battery, seen from the front
16_saddles = [
    'color("#e6e6e1") intersection() { back(); translate([part_x, 20, 0]) cube([body_w + 1 - part_x, body_d, 90]); }',
    "124,-60,120,190,50,40",
]
# underside with the M5 mount insert
07_underside = [
    'color("#f2f2ee") body(dedication = false); color("#222326") place_feet(); color("#26282b") screws_feet(true);',
    "40,-160,-260,112,40,40",
]
